name: CI Build and Test

on:
  push:
    branches: [ "feature/init" ]
  pull_request:
    branches: [ "feature/init" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Add libchicken-dev for chicken.h header and static/shared libraries
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 cmake make chicken-bin libchicken-dev

      - name: Install Chicken Scheme eggs
        run: |
          sudo chicken-install srfi-4 srfi-63

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_C_COMPILER=gcc-13

      - name: Build project
        run: |
          cmake --build build

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure || true