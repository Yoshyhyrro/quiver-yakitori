name: CI Build and Test

on:
  push:
    branches: [ "feature/Newton-Okounkov" ]
  pull_request:
    branches: [ "feature/Newton-Okounkov" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install system build tools and dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 cmake make wget

      # Clone, compile, and install CHICKEN Scheme from repository
      - name: Install CHICKEN Scheme 6
        run: |
          git clone --depth 1 https://github.com/chicken-scheme/chicken-core.git
          cd chicken-core
          make PLATFORM=linux C_COMPILER=gcc-13
          sudo make PLATFORM=linux install
          sudo ldconfig

      # Install CHICKEN Scheme eggs
      - name: Install CHICKEN Scheme eggs
        run: |
          sudo chicken-install srfi-4 srfi-63

      # Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy pytest

      # Configure CMake project
      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_C_COMPILER=gcc-13

      # Build C/Scheme library
      - name: Build C/Scheme library
        run: |
          cmake --build build

      # Build Python extension via setup.py
      - name: Build Python extension
        run: |
          python setup.py build_ext --inplace

      # Execute full cross-language integration test suite
      - name: Run integration test suite
        run: |
          make test-all