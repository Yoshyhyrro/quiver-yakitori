name: CI Build and Test

on:
  push:
    branches: [ "feature/init" ]
  pull_request:
    branches: [ "feature/init" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install system dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 cmake make chicken-bin libchicken-dev

      # Install Chicken Scheme dependencies
      - name: Install Chicken Scheme eggs
        run: |
          sudo chicken-install srfi-4 srfi-63

      # Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy pytest

      # Configure and build CMake C23/Scheme bridge
      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_C_COMPILER=gcc-13

      - name: Build C/Scheme library
        run: |
          cmake --build build

      # Build Python extension via setup.py
      - name: Build Python extension
        run: |
          python setup.py build_ext --inplace

      # Run C23/Scheme library test via Makefile target
      - name: Run Scheme integration test
        run: |
          make test-all

      # Run Python/PyTorch test suite
      - name: Run Python PyTorch simulation test
        run: |
          python test_quiver.py
