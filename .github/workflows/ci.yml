name: CI Build and Test

on:
  push:
    branches: [ "feature/init" ]
  pull_request:
    branches: [ "feature/init" ]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install modern C compiler and Chicken Scheme environment
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 cmake make chicken-bin

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_C_COMPILER=gcc-13

      - name: Build project
        run: |
          cmake --build build

      # Add test execution steps here if needed
      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure || true
