name: CI Build and Test

on:
  push:
    branches: [ "feature/Newton-Okounkov" ]
  pull_request:
    branches: [ "feature/Newton-Okounkov" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Provision Python runtime environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install system build tools
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 cmake make wget git

      # Download and build CHICKEN Scheme 6 release tarball
      - name: Install CHICKEN Scheme 6
        run: |
          wget https://code.call-cc.org/dev-snapshots/2024/05/26/chicken-6.0.0dev.tar.gz
          tar -xzf chicken-6.0.0dev.tar.gz
          cd chicken-6.0.0dev
          CC=gcc-13 ./configure
          make
          sudo make install
          sudo ldconfig

      # Resolve CHICKEN Scheme extension dependencies
      - name: Install CHICKEN Scheme eggs
        run: |
          sudo chicken-install srfi-4 srfi-63

      # Resolve Python package dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy pytest

      # Configure CMake build system for C/Scheme bridge
      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_C_COMPILER=gcc-13

      # Compile C/Scheme shared library
      - name: Build C/Scheme library
        run: |
          cmake --build build

      # Compile Python native extension
      - name: Build Python extension
        run: |
          python setup.py build_ext --inplace

      # Execute cross-language integration test suite
      - name: Run integration test suite
        run: |
          make test-all